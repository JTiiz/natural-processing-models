[project]
name = "fake-news-classifier"
version = "1.0.0"
description = "Fake or real news classification with three scikit-learn text pipelines"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub<1.0",
    "joblib>=1.6.0",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pyyaml>=6.0.3",
    "scikit-learn==1.9.1",
    "streamlit>=1.67.0",
]

[dependency-groups]
train = [
    "matplotlib>=3.11.2",
]
